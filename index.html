<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Flujo de Caja</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <h1>💰 Mi Flujo de Caja</h1>

  <section class="saldos">
    <div class="tarjeta">
      <h2>Caja</h2>
      <p id="saldo-caja">$0</p>
    </div>
    <div class="tarjeta">
      <h2>Banco</h2>
      <p id="saldo-banco">$0</p>
    </div>
    <div class="tarjeta total">
      <h2>Total</h2>
      <p id="saldo-total">$0</p>
    </div>
  </section>

  <section class="formulario">
    <h2>Registrar movimiento</h2>
    <form id="form-movimiento">
      <label>Tipo:
        <select id="tipo" required>
          <option value="ingreso">Ingreso (entra dinero)</option>
          <option value="egreso">Egreso (sale dinero)</option>
          <option value="transferencia">Transferencia entre cuentas</option>
        </select>
      </label>

      <label>Cuenta:
        <select id="cuenta" required>
          <option value="caja">Caja</option>
          <option value="banco">Banco</option>
        </select>
      </label>

      <label id="label-cuenta-destino" style="display:none;">
        Cuenta destino:
        <select id="cuenta-destino">
          <option value="banco">Banco</option>
          <option value="caja">Caja</option>
        </select>
      </label>

      <label>Monto:
        <input type="number" id="monto" min="0.01" step="0.01" required>
      </label>

      <label>Descripción:
        <input type="text" id="descripcion" placeholder="Ej: Sueldo, supermercado..." required>
      </label>

      <label>Fecha:
        <input type="date" id="fecha" required>
      </label>

      <button type="submit">Registrar</button>
    </form>
  </section>

  <section class="historial">
    <h2>Historial de movimientos</h2>
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Tipo</th>
          <th>Cuenta</th>
          <th>Descripción</th>
          <th>Monto</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabla-movimientos"></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
